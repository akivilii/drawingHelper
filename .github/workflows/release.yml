name: Build, Test & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run Core unit tests
        shell: pwsh
        run: dotnet run --project csharp/DrawingHelper.Core.Tests/DrawingHelper.Core.Tests.csproj -c Release

      - name: Build installer and portable ZIP
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File csharp/build_installer.ps1

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DrawingHelper-windows-artifacts
          path: |
            csharp/installer_out/DrawingHelperSetup.exe
            csharp/installer_out/DrawingHelper-win-x64-portable.zip
            csharp/installer_out/SHA256SUMS.txt

      - name: Publish GitHub Release (on version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          gh release create $tag `
            csharp/installer_out/DrawingHelperSetup.exe `
            csharp/installer_out/DrawingHelper-win-x64-portable.zip `
            csharp/installer_out/SHA256SUMS.txt `
            --title "DrawingHelper $tag" `
            --generate-notes
